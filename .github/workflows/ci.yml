name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          # pnpm 11.4.0 (pinned above) requires Node >=22.13 — it uses the
          # node:sqlite built-in, unavailable on Node 20. Node 20 failed
          # inside setup-node's own pnpm cache-path probing before any of
          # our steps ran.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm exec vitest run
